<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout reach the notch and home-indicator
         safe areas, which the phone layout pays back with
         env(safe-area-inset-*); interactive-widget asks Android Chrome to
         resize the viewport when the keyboard opens instead of overlaying the
         composer. theme-color is the MDL brand primary (MDL-THEME-01). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#D40000" />
    <!-- Installed-app metadata (SPEC-014). iOS takes the home-screen label from
         apple-mobile-web-app-title and hides Safari's chrome because of
         apple-mobile-web-app-capable, which the web manifest's display alone
         does not guarantee on older iOS versions. The status bar keeps the
         `default` style so iOS lays the page out below it and derives the
         glyph color from the system appearance the theme already follows;
         `black-translucent` would slide the header under the clock with white
         glyphs over a light conversation. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MDL-HARNESS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=cat-1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=cat-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=cat-1" />
    <title>MDL-HARNESS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
