# The layer this bundle contributes to whichever profile lists it (SPEC-025).
#
# One row, at the root of the host composition: the plugin publishes no service,
# so it needs no isolate realm, and it consumes `webServer`, `fs`, `tools` and
# `sessions` from the host exactly as it finds them. The package name resolves
# through the profile's healed node_modules fallback, where `install.sh` copies
# it and links its own dependency tree.
- insert:
    - id: chat-files
      name: dsh-chat-files
