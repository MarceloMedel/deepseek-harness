# The layer this bundle contributes to whichever profile lists it (SPEC-035).
#
# One row, at the root of the host composition: the panel publishes no service,
# so it needs no isolate realm, and it consumes `fs`, `sessions`, `shell` and
# `sandboxPolicy` from the host exactly as it finds them. The package name
# resolves through the profile's node_modules fallback, where `install.sh`
# publishes it.
- insert:
    - id: shell-panel
      name: dsh-shell-panel
