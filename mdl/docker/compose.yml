name: mdl-harness

services:
  mdl-harness:
    image: mdl-harness:local
    build:
      context: ../..
      dockerfile: mdl/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:8080"
    environment:
      DSH_HOME: /data/dsh
      DSH_PERMISSION_MODE: workspace-write
    volumes:
      - mdl-dsh-home:/data/dsh
      - mdl-workspace:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  mdl-dsh-home:
  mdl-workspace:
