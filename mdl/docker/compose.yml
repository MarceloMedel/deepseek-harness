name: mdl-harness

services:
  mdl-harness:
    image: mdl-harness:local
    build:
      context: ../..
      dockerfile: mdl/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:8080"
    environment:
      DSH_HOME: /data/dsh
      DSH_PERMISSION_MODE: workspace-write
      # Public authority accepted by the /api browser-trust fence. It does not
      # grant the privileged configuration plane, which stays loopback-only.
      DSH_TRUSTED_HOST: dsh.devmedel.com
      # Read-write deploy key scoped to MarceloMedel/pipay-sii. The key is a
      # read-only bind mount from the host, never an image layer, environment
      # value, or volume (which the daily backup archives). Only that exact
      # remote is rewritten to SSH; other repositories keep their HTTPS URL.
      GIT_SSH_COMMAND: >-
        ssh -i /etc/mdl-harness/git/pipay_deploy -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/mdl-harness/git/known_hosts
        -o User=git
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.ssh://git@github.com/MarceloMedel/pipay-sii.git.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/MarceloMedel/pipay-sii.git
    extra_hosts:
      # Ollama runs on the host and listens on 11434; containers reach it
      # through the bridge gateway.
      - host.docker.internal:host-gateway
    volumes:
      - mdl-dsh-home:/data/dsh
      - mdl-workspace:/workspace
      # Host projects, read-write and at the same absolute path, so a session
      # can pick one as its workspace. The mount never includes
      # /srv/projects/secrets, which stays root-only outside the container's
      # user. Set MDL_PROJECTS_DIR to mount another directory.
      - ${MDL_PROJECTS_DIR:-/srv/projects}:/srv/projects
      # Deploy key and pinned GitHub host keys, outside the projects mount so
      # the agent cannot rewrite them.
      - ${MDL_GIT_DIR:-/home/ubuntu/.config/mdl-harness/git}:/etc/mdl-harness/git:ro
      - ./settings.yaml:/etc/mdl-harness/settings.yaml:ro
    networks:
      - default
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The host has 6 vCPU and 11 GiB, shared with Ollama and personal-suite.
    # These bounds cover the agent's subprocesses without starving them.
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 512
    stop_grace_period: 20s

networks:
  edge:
    external: true
    name: edge

volumes:
  mdl-dsh-home:
  mdl-workspace:
