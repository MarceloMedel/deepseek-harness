name: mdl-harness

services:
  mdl-harness:
    image: mdl-harness:local
    build:
      context: ../..
      dockerfile: mdl/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:8080"
    environment:
      DSH_HOME: /data/dsh
      DSH_PERMISSION_MODE: workspace-write
      # Public authority accepted by the /api browser-trust fence. On its own it
      # does not grant the privileged configuration plane (SPEC-024 admits that
      # plane only with DSH_ACCESS_AUD below).
      DSH_TRUSTED_HOST: dsh.devmedel.com
      # Cloudflare Access application Audience (AUD) tag for dsh.devmedel.com.
      # Setting it lets the privileged configuration plane (Configuración →
      # Modelos, credentials, directory picker) answer on the public hostname to
      # a request whose Access assertion this process verified. Leaving it unset
      # keeps that plane on loopback, which is the state before SPEC-024.
      DSH_ACCESS_AUD: ${DSH_ACCESS_AUD:-}
      # Neon project the MCP row is scoped to (SPEC-026). The identifier is not a
      # secret, so it rides the environment and stays out of the versioned
      # overlay; without it the row is not composed at all.
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:-}
      # Overrides the credential path the overlay reads (SPEC-026). Defaults to
      # the mount below; the value is a path, never the credential.
      MDL_NEON_TOKEN_FILE: ${MDL_NEON_TOKEN_FILE:-/etc/mdl-harness/neon/token}
      GIT_TERMINAL_PROMPT: "0"
      # No repository-specific git configuration here (SPEC-011). Cloning,
      # pushing and PRs all go over HTTPS with the mounted token, which reaches
      # every repository the token is scoped to; the credential helper in the
      # image's /etc/gitconfig answers for github.com. A deployment that needs
      # more (an SSH alias, a different helper) mounts a fragment at
      # /etc/mdl-harness/git/gitconfig, which that file includes when present.
    extra_hosts:
      # Ollama runs on the host and listens on 11434; containers reach it
      # through the bridge gateway.
      - host.docker.internal:host-gateway
    volumes:
      - mdl-dsh-home:/data/dsh
      - mdl-workspace:/workspace
      # Host projects, read-write and at the same absolute path, so a session
      # can pick one as its workspace. The mount never includes
      # /srv/projects/secrets, which stays root-only outside the container's
      # user. Set MDL_PROJECTS_DIR to mount another directory.
      - ${MDL_PROJECTS_DIR:-/srv/projects}:/srv/projects
      # GitHub token for `gh` and HTTPS pushes (SPEC-010): read-only, outside the
      # projects mount, and read per invocation by the image's gh wrapper, so it
      # never becomes an environment value. Rotating it is replacing the file.
      - ${MDL_GH_DIR:-/home/ubuntu/.config/mdl-harness/gh}:/etc/mdl-harness/gh:ro
      # Neon API key for the MCP row (SPEC-026): same contract as the GitHub
      # token — read-only, outside the volume, read at activation by the overlay
      # and never an environment value. The directory must exist on the host and
      # be owned by the container's uid, or the entrypoint skips the row.
      - ${MDL_NEON_DIR:-/home/ubuntu/.config/mdl-harness/neon}:/etc/mdl-harness/neon:ro
      - ./settings.yaml:/etc/mdl-harness/settings.yaml:ro
    networks:
      - default
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The host has 6 vCPU and 11 GiB, shared with Ollama and personal-suite.
    # These bounds cover the agent's subprocesses without starving them.
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 512
    stop_grace_period: 20s

networks:
  edge:
    external: true
    name: edge

volumes:
  mdl-dsh-home:
  mdl-workspace:
