use_default_settings: true

general:
  instance_name: "mdl search"

search:
  safe_search: 0
  # The DSH search bundle asks for `?format=json` (its SearXNG adapter sends
  # `format=json` and `Accept: application/json`). SearXNG serves HTML only by
  # default, so this pair is the integration rather than a preference: without
  # `json` every query from the agent fails before it reaches an engine.
  formats:
    - html
    - json

server:
  # The service publishes no port and only this deployment's own Docker network
  # reaches it, so the anti-bot limiter would cost API calls and protect
  # nothing. A public instance would need it on, plus the token the search
  # bundle can send.
  limiter: false
  public_instance: false
  image_proxy: false
  # secret_key comes from SEARXNG_SECRET in the service environment, never from
  # this versioned file.

engines:
  # The image's shipped defaults leave nearly every general engine off — 260
  # engines advertised, 7 enabled, and only `google cse` of those covers the
  # open web. This list is the result of measuring each candidate from this
  # host (SPEC-028 SRX-03), not of trusting a default: eight queries per engine,
  # reading `unresponsive_engines` rather than HTTP status.
  #
  # Working, so switched on:
  #   google cse  160 results, 20 per query, and the only engine that answered
  #               every time (it takes the official CSE path, not the scrape)
  #
  # Measured as worse than absent, so explicitly off:
  #   bing        answered half the queries, but with results unrelated to them:
  #               "receta de pan amasado" returned TikTok brand-deal pages and
  #               "searxng documentation" returned zk-crypto papers. Bing serves
  #               the bot a generic page whose links the parser reads as hits, so
  #               a wrong answer replaced no answer. That is the reason it is off
  #               while `google cse` carries the motor.
  #   google      Suspended: access denied (the HTML scrape; `google cse` is the
  #               one that works, so this would only waste a request per query)
  #   qwant       Suspended: access denied
  #   baidu       Suspended: CAPTCHA
  #   duckduckgo  anti-bot challenge on the probe; kept off
  #   brave       rate-limited the IP (429) on the probe; kept off
  # `mojeek` and `startpage` are absent from this image entirely, so they are
  # not listed. Re-measure before switching any of these back on: an engine's
  # verdict depends on the host's IP and on its own anti-bot mood.
  - name: bing
    disabled: true
  - name: google
    disabled: true
  - name: qwant
    disabled: true
  - name: baidu
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
