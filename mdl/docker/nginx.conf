worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # The shell and every client-plugin bundle are JavaScript served from the
  # container, and DSH itself replies uncompressed. Compressing here is what the
  # phone pays: the shell drops from 1,2 MB to about 330 KB and a full plugin
  # roster from 3,0 MB to about 700 KB (SPEC-018). Fonts, icons and PNGs are
  # already compressed and stay untouched.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/manifest+json
    application/json
    image/svg+xml
    text/css
    text/javascript
    text/plain;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 200m;

    location / {
      proxy_pass http://127.0.0.1:3080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
